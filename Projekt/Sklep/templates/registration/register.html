{% extends 'sklep/base.html' %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Rejestracja</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            Załóż konto
        </button>
    </form>
</div>
{% endblock %}
